patch:
  switches/@0/reset: 0
  switches/@2:
    name: zh_hans
    states: [ '繁體', '简体' ]

  engine/processors/@last: express_editor
  engine/translators/@1: ~ # table_translator@custom_phrase
  engine/filters/@0: ~ # simplifier@simp_zh_tw
  engine/filters/@next: reverse_lookup_filter@self_reverse_lookup

  speller/algebra/@before 0: 'xform|#.*$||'

  self_reverse_lookup:
    dictionary: iridium_bpmf_ext
    comment_format:
      - 'xform|^[^#]+||'
      - 'xform|#||'

  punctuator:
    full_shape:
      ' ': { commit: '　' }
      '<': '，'
      '>': '。'
      '?': '？'
      ':': '：'
      "'": '、'
      '"': '；'
      '\': [ '／', '＼' ]
      '|': [ '｜', '¶', '§' ]
      '~': '～'
      '!': '！'
      '@': [ '＠', '☯' ]
      '#': [ '＃', '⌘' ]
      '%': [ '％', '°', '℃' ]
      '$': [ '＄', '￥', '€', '£', '¥', '¢', '¤' ]
      '^': '……'
      '&': '＆'
      '*': [ '＊', '・', '×', '※', '❂' ]
      '(': '（'
      ')': '）'
      '_': [ '—', '——' ]
      '+': '＋'
      '=': '＝'
      '[': [ '「', '《', '【', '〔', '［' ]
      ']': [ '」', '》', '】', '〕', '］' ]
      '{': [ '『', '〈', '〖', '｛' ]
      '}': [ '』', '〉', '〗', '｝' ]
    half_shape:
      '<': '，'
      '>': '。'
      '?': '？'
      ':': '：'
      "'": '、'
      '"': '；'
      '\': [ '/', '／', '\', '＼' ]
      '|': [ '|', '｜', '¶', '§' ]
      '`': { commit: '`' }
      '~': [ '~', '～' ]
      '!': '！'
      '@': { commit: '@' }
      '#': { commit: '#' }
      '%': [ '%', '％', '°', '℃' ]
      '$': [ '$', '¥', '€', '£', '¢', '¤' ]
      '^': [ '^', '…', '……' ]
      '&': '&'
      '*': [ '*', '＊', '・', '×', '※', '❂' ]
      '(': [ '(', '（' ]
      ')': [ ')', '）' ]
      '_': [ '_', '—', '——' ]
      '+': '+'
      '=': '='
      '[': [ '「', '《', '【', '〔', '［' ]
      ']': [ '」', '》', '】', '〕', '］' ]
      '{': [ '『','〈', '〖', '｛' ]
      '}': [ '』','〉', '〗', '｝' ]
    symbols:
      '`': [ '`' ]

  # Override `[` and `]` behaviors.
  key_binder:
    bindings:
      - { when: has_menu, accept: comma,  send: comma }   # ㄝ
      - { when: has_menu, accept: period, send: period }  # ㄡ
      - { when: has_menu, accept: minus,  send: minus }   # ㄦ

      - { when: has_menu, accept: Shift+BackSpace, send: BackSpace }
      - { when: has_menu, accept: BackSpace,       send: Control+BackSpace }

      - { when: has_menu, accept: Left,  send: Page_Up }
      - { when: has_menu, accept: Right, send: Page_Down }
